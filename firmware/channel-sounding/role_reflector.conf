CONFIG_APP_ROLE_REFLECTOR=y

CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="cs-reflector"
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_RAS_RRSP=y

CONFIG_BT_CTLR_SDC_CS_ROLE_REFLECTOR_ONLY=y

# PHY changes are left to the initiator.
CONFIG_BT_AUTO_PHY_UPDATE=n

# Many USB power banks switch off when the load is very small. This keeps a
# small constant load so the reflector stays powered during long runs.
CONFIG_APP_POWER_BANK_LOAD=y
